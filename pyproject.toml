[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enmotion-robot"
version = "0.1.0"
description = "Software stack for the Enmotion emotional companion robot"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "pyserial>=3.5,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
agent = ["qwen-agent==0.0.34", "soundfile>=0.13,<1", "tqdm>=4.67,<5", "python-dateutil>=2.9,<3"]
speech = [
  "numpy>=1.24,<3",
  "sherpa-onnx>=1.12,<3",
  "sherpa-onnx-bin>=1.12,<3",
]

dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
enmotion-device = "enmotion_robot.device_bridge:main"
enmotion-runtime = "enmotion_robot.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enmotion_robot = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

