<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小蓝 · 视觉编排</title>
<style>body{background:#07121d;color:#cdeaf3;font:16px/1.7 system-ui;margin:0;padding:5vw}main{max-width:950px;margin:auto}a{color:#74e8e1}canvas{width:100%;border:1px solid #284b5e;border-radius:20px;background:#0b1e2c}section{display:flex;gap:16px;flex-wrap:wrap}article{flex:1;min-width:240px;border:1px solid #284b5e;border-radius:18px;padding:22px}h1{font-size:28px}small{color:#87aabc}li{margin-bottom:8px}button{background:#143442;color:white;border:1px solid #38768c;padding:10px 20px;border-radius:20px}</style>
<main><a href="/face">← 返回小蓝</a><h1>视觉感知 / 多模态编排</h1><p id="state">正在连接…</p><canvas id="map" width="640" height="360" aria-label="目标在画面中的归一化位置"></canvas><small>位置示意图，不是实时监控画面。图像仅在本机内存处理，不保存、不上传。不识别身份，也不推断人的情绪。</small><section><article><h2>当前决策</h2><p id="decision"></p><button id="touch">测试触摸优先级</button><p><small>语音 ＞ 触摸 ＞ 视觉 ＞ 待机；动作仅驱动模拟器。</small></p></article><article><h2>视觉事件</h2><ul id="events"></ul></article></section></main>
<script>const $=id=>document.getElementById(id),ctx=$('map').getContext('2d'),names={arrived:'检测到目标进入',approaching:'目标在画面中变大（可能靠近）',left:'目标离开',empty:'长时间未检测到目标'};let pending=false;async function update(){if(pending)return;pending=true;try{const r=await fetch('/api/vision',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();$('state').textContent=(s.online?'摄像头在线':'摄像头离线或未启用')+' · '+s.source;$('decision').textContent='优先级：'+s.priority+' / 稳定目标：'+(s.present?'有':'无')+' / 检测数：'+s.detections.length;ctx.clearRect(0,0,640,360);for(const d of s.detections){const [x,y,w,h]=d.box;ctx.strokeStyle=d.kind==='face'?'#80f5d0':'#83adff';ctx.lineWidth=2;ctx.strokeRect(x*640,y*360,w*640,h*360);ctx.fillStyle=ctx.strokeStyle;ctx.font='14px system-ui';ctx.fillText(d.kind,x*640,Math.max(18,y*360-5))}$('events').replaceChildren(...s.events.slice(0,8).map(e=>{const li=document.createElement('li');li.textContent=e.time+'s · '+(names[e.event]||e.event);return li}))}catch(e){$('state').textContent='服务离线，正在重试'}finally{pending=false}}$('touch').onclick=()=>fetch('/api/vision/touch',{method:'POST'});update();setInterval(update,700);</script></html>
