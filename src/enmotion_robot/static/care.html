<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小蓝 · 陪伴设置</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e5f7ff;background:#08121c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#153a4e,transparent 65%);min-height:100vh}main{max-width:850px;margin:auto;padding:40px 24px}a{color:#89e9ed;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;letter-spacing:2px}p,small{color:#9ab5c8;line-height:1.8}.card{padding:26px;border:1px solid #294758;border-radius:24px;background:#10222dcc;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;margin:12px 0}input[type=number]{display:block;width:100%;padding:14px;margin-top:8px;border-radius:12px;border:1px solid #3d6171;background:#0a1822;color:white;font-size:22px}input[type=checkbox]{accent-color:#6dd9df;width:20px;height:20px;vertical-align:middle;margin-right:10px}button{background:#91ece7;border:0;border-radius:14px;padding:14px 28px;font-size:16px;cursor:pointer;color:#082127}#message{margin-left:14px}.tag{color:#9de7d6}ul{padding-left:20px;line-height:2} @media(max-width:560px){.grid{grid-template-columns:1fr}main{padding:20px}}
</style>
<main><header><a href="/face">← 返回小蓝</a><a href="/">工作台</a></header><h1>让小蓝照顾你的工作节奏</h1><p>欢迎回来，喝点水，偶尔起来走走。提醒在本机运行，会等当前对话结束再开口。</p>
<form class="card" id="settings"><label><input id="enabled" type="checkbox">开启陪伴提醒</label><label><input id="welcome" type="checkbox">回到工位时欢迎我</label><div class="grid"><label>喝水间隔 · 分钟<input id="water_minutes" type="number" min="5" max="240" required></label><label>工位休息间隔 · 分钟<input id="break_minutes" type="number" min="5" max="240" required></label></div><p>摄像头需要检测到你在工位前。离开两分钟后，本轮计时会重置；欢迎语至少间隔十分钟。此功能判断在场时间，尚不能判断坐姿或是否已经喝水。</p><button>保存设置</button><span id="message" role="status"></span></form>
<section class="card"><div class="tag" id="presence">正在连接…</div><div class="grid"><p id="water"></p><p id="rest"></p></div><small>计时从本次服务启动后开始，设置在重启后保留。识别可能受光线和摄像头角度影响。</small><p id="pending"></p></section>
<section class="card"><h2>最近的轻声提醒</h2><ul id="history"></ul></section></main>
<script>
const $=id=>document.getElementById(id);let initialized=false;
async function refresh(){try{const r=await fetch('/api/wellness');if(!r.ok)throw Error();const s=await r.json();if(!initialized){for(const [k,v]of Object.entries(s.config)){if(typeof v==='boolean')$(k).checked=v;else $(k).value=v;}initialized=true;}$('presence').textContent=!s.config.enabled?'陪伴提醒已暂停':s.present?'你在工位前 · 正在计时':'等待你回到工位';$('water').textContent=`喝水计时 ${Math.floor(s.water_seconds/60)} / ${s.config.water_minutes} 分钟`;$('rest').textContent=`工位计时 ${Math.floor(s.work_seconds/60)} / ${s.config.break_minutes} 分钟`;$('pending').textContent=s.pending.length?'提醒已排队，将在安静且无对话时播放。':'现在没有等待播放的提醒。';$('history').replaceChildren(...s.history.map(x=>{const li=document.createElement('li');li.textContent=new Date(x.at*1000).toLocaleTimeString()+' · '+x.text;return li;}));if(!s.history.length){const li=document.createElement('li');li.textContent='还没有播放提醒';$('history').append(li);}}catch{$('presence').textContent='连接暂时中断，正在重试';}}
$('settings').onsubmit=async e=>{e.preventDefault();$('message').textContent='保存中…';try{const r=await fetch('/api/wellness',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('enabled').checked,welcome:$('welcome').checked,water_minutes:Number($('water_minutes').value),break_minutes:Number($('break_minutes').value)})});if(!r.ok)throw Error();$('message').textContent='已保存';refresh();}catch{$('message').textContent='保存失败，请重试';}};refresh();setInterval(refresh,2000);
</script></html>
