<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小蓝 · 联网查询</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e8f7ff;background:#08131d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#194456,transparent 65%);min-height:100vh}main{max-width:860px;margin:auto;padding:30px 24px}nav{display:flex;justify-content:space-between}a{color:#a2eeeb;text-decoration:none}h1{font-size:32px;letter-spacing:1px;margin-top:38px}p{line-height:1.85;color:#a5c1ce}.panel,.source{border:1px solid #2b4b5b;background:#112632cc;border-radius:22px;padding:24px;margin:20px 0}form{display:flex;gap:12px}input{flex:1;min-width:0;padding:16px;border:1px solid #3a6170;border-radius:14px;background:#071922;color:white;font-size:16px}button{background:#a2eeeb;border:0;border-radius:14px;padding:12px 24px;color:#062e36;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.meta{font-size:12px;color:#7fa7b9;line-height:1.8}.source h3{font-size:18px;line-height:1.5;margin:10px 0}.source p{font-size:14px;margin-bottom:8px}.tag{font-size:12px;letter-spacing:1px;color:#7edcd6}#answer{font-size:18px;white-space:pre-wrap;color:#e4f4fb}#status{min-height:20px}small{color:#91b3c2;line-height:1.8}.hint{font-size:13px} @media(max-width:540px){form{flex-direction:column}main{padding:24px 16px}.panel,.source{padding:20px}}
</style>
<main><nav><a href="/face">← 返回小蓝</a><a href="/">工作台</a></nav><h1>让答案有出处</h1><p>说一句“嘿，小蓝，帮我搜索……”也可以。这里会显示最近一次联网查询的摘要、时间和来源。</p>
<section class="panel"><form id="form"><input id="query" maxlength="300" required aria-label="查询内容" placeholder="例如：搜索 Jetson Orin Nano 官方文档"><button id="send">查询</button></form><p class="hint">也可以问“上海明天天气怎么样”。查询只发送当前问题，不附带工作笔记和历史对话。</p><div class="meta" id="status" role="status"></div></section>
<section class="panel" id="result" hidden><div class="tag" id="kind"></div><p id="answer"></p><div class="meta" id="time"></div></section><div id="sources"></div><p><small>网页结果是搜索摘要，可能过时或不完整；查询时间不等于网页发布时间。请打开来源核对细节。天气数据来自 <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>，属于天气预报。</small></p></main>
<script>
const $=id=>document.getElementById(id);let last='',busy=false;
function render(s){if(!s)return;last=JSON.stringify(s);$('result').hidden=false;$('kind').textContent=s.kind==='weather'?'城市天气 · 预报':s.kind==='clarification'?'请补充信息':'网页搜索 · 摘要';$('answer').textContent=s.reply;$('time').textContent=(s.fetched_at?'查询时间：'+new Date(s.fetched_at).toLocaleString('zh-CN'):'')+(s.cached?' · 一分钟内缓存':'');$('sources').replaceChildren(...(s.sources||[]).map(x=>{const box=document.createElement('article');box.className='source';const label=document.createElement('div');label.className='tag';label.textContent=x.domain||'来源';const h=document.createElement('h3');const a=document.createElement('a');a.textContent=x.title;try{const u=new URL(x.url);if(['http:','https:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';}}catch{}h.append(a);const p=document.createElement('p');p.textContent=x.snippet;box.append(label,h,p);return box;}));}
$('form').onsubmit=async e=>{e.preventDefault();busy=true;$('send').disabled=true;$('status').textContent='正在联网查询…';try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('query').value})});if(!r.ok)throw Error('查询失败，请检查输入后重试');const s=await r.json();render(s);$('status').textContent=s.ok===false?'未取得有效结果':s.kind==='clarification'?'等待您补充':'查询完成';}catch(e){$('status').textContent=e.message||'连接暂时中断，请重试';}finally{busy=false;$('send').disabled=false;}};
async function refresh(){if(busy)return;try{const r=await fetch('/api/search/status');if(!r.ok)return;const s=await r.json();if(s.last&&JSON.stringify(s.last)!==last)render(s.last);}catch{}}refresh();setInterval(refresh,3000);
</script></html>
